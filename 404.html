<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="./icons/icon.png">
        <title>Page Not Found</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="manifest" href="./manifest.json">
    </head>
    <body>
        <main>
            <section class="error-page">
                <span class="error-code">404</span>
                <h1>Page Not Found</h1>
                <p>The page you're looking for doesn't exist or may have been moved.</p>

                <a class="navbar-link" href="/" aria-label="Go Back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                    <span>Go Back</span>
                </a>
            </section>

            <footer class="app-footer" style="text-align: left; justify-content: start;">
                <span>
                    &copy; <span id="copyrightYear"></span> Braden Wood. All rights reserved.<br>
                    Unauthorized copying, redistribution, or reuse is prohibited.
                </span>
            </footer>
        </main>

        <script src="./script.js"></script>

</html>
