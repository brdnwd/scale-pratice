<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="./icons/icon.png">
        <title>404 - Page Not Found</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="manifest" href="./manifest.json">
    </head>
    <body>
        <main>
            <section class="error-page">
                <span class="error-code">404</span>
                <h1>Page Not Found</h1>
                <p>The page you're looking for doesn't exist or may have been moved.</p>

                <a href="/" class="text-button error-home" aria-label="Return to home">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                    <span>Home</span>
                </a>
            </section>

            <footer class="app-footer">
                <span>&copy; <span id="copyrightYear"></span> Braden Wood</span>
            </footer>
        </main>

        <script src="./script.js"></script>
    </body>
</html>
